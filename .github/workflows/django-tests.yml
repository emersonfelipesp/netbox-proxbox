name: Django Tests
run-name: Django Tests (${{ github.event_name }} ${{ github.ref }} @ ${{ github.sha }})

# Runs the NetBox-backed Django suites for sync-state models, form/M2M
# persistence, the fail-closed backend-key boundary, and runtime view/template
# rendering. The mocked suite cannot prove ORM transactions, real registry
# wiring, Django template-loader behavior, forms, imports, serializers, or signals.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-tests:
    # Keep the host OS line stable; GitHub maintains the image behind this
    # label, while every fetchable action, service, source, and Python/tool
    # input below is pinned independently.
    # profile isolates additive companion contracts: include entries that only
    # repeat netbox/pdm from an original combination merge into that job, so
    # all_companions and openbao must use distinct profile values or they
    # collapse onto the base v4.7.0 cell (hosted evidence previously showed 6).
    name: Django ${{ matrix.netbox }} pdm=${{ matrix.pdm }} profile=${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Declared support is the backward-compatible NetBox 4.5.8 - 4.7.99
        # range. Keep the established 4.5/4.6 cells and add the official GA
        # cell so a NetBox upgrade is tested without changing plugin state.
        # The extra 4.6.6 cell loads the supported PDM override so its registry
        # identity contract cannot become a permanently skipped optional branch.
        # NetBox 4.7 needs PostgreSQL
        # 15+ and Redis 6+ and installs the ltree extension during migrate —
        # the postgres:16-alpine / redis:7-alpine services below already
        # satisfy this, and POSTGRES_USER creates a superuser role that can
        # CREATE EXTENSION.
        netbox: ["v4.5.8", "v4.5.10", "v4.6.0", "v4.6.6", "v4.7.0"]
        pdm: [false]
        profile: [base]
        include:
          - netbox: "v4.5.8"
            pdm: false
            profile: base
            netbox_ref: 75e1b86613792458b4d4c8d0cbbfc94df16cfaaf
            netbox_version: "4.5.8"
            netbox_designation: ""
            netbox_requirements_sha256: 646c5bb635d5b9b126c6af4d56664dfde461608bdcaa8a65c1735ac5d8ddde9b
            netbox_input_sha256: 904ecc650c02df62fa83f59ed714e9b16737fc558cff5a909ca9b31004e593b9
            netbox_lock: ci/netbox-requirements/v4.5.8-py312-linux-x86_64.txt
            netbox_lock_sha256: 9e5831dd463224b3171b9470f628652fb6f8ffdf4c8ed29fbfcde8e185dcbbe2
          - netbox: "v4.5.10"
            pdm: false
            profile: base
            netbox_ref: b78bd713294564e0421c36c936a909e64da04b8d
            netbox_version: "4.5.10"
            netbox_designation: ""
            netbox_requirements_sha256: d68f08fb6167317174be89cda3045ee0e2fa34dd6e18ce19db2a31cf31a26e6f
            netbox_input_sha256: fba47c0891dc3aac0917550698436f326f650469c052ab2ecad69a5bbe29683b
            netbox_lock: ci/netbox-requirements/v4.5.10-py312-linux-x86_64.txt
            netbox_lock_sha256: 444227344949ece88098311b4d36a42ee179c2e325cc19bbd1b69efc51d8ec61
          - netbox: "v4.6.0"
            pdm: false
            profile: base
            netbox_ref: 00791344e68213bde942218283dce03cc3941c30
            netbox_version: "4.6.0"
            netbox_designation: ""
            netbox_requirements_sha256: 0d88cea37b413f22953ead2c2c341c82fe7a5e5d8a01f42632288676db8d66b6
            netbox_input_sha256: d290172ade3a4b57221c1b008d2a91132041aafd2f2d38ec0612b316bad74dcc
            netbox_lock: ci/netbox-requirements/v4.6.0-py312-linux-x86_64.txt
            netbox_lock_sha256: 2ff751fc6cbd1d6b8bfb73a65b9f5341cdf180df4fbb0833a2a3a6b3eece53df
          - netbox: "v4.6.6"
            pdm: false
            profile: base
            netbox_ref: fb8c455ba61b57119a70670612dfdd05e8438b10
            netbox_version: "4.6.6"
            netbox_designation: ""
            netbox_requirements_sha256: 25eb62e54362568599c7701a528a7ac24dbe0400d5311fc496eab866bd6174b9
            netbox_input_sha256: 58bf25c4c923034bc02ab2535a6221f1485171617985b0969136776a21f86a96
            netbox_lock: ci/netbox-requirements/v4.6.6-py312-linux-x86_64.txt
            netbox_lock_sha256: ee0227ffde613b6b08954c08f7142df73306734b4460e64b1a53a3be452ea92a
          - netbox: "v4.7.0"
            pdm: false
            profile: base
            netbox_ref: 5f06007e4c9bacc93ce17c1e645fc1143d60df3d
            netbox_version: "4.7.0"
            netbox_designation: ""
            netbox_requirements_sha256: 61589a94b25149765d230d3f33597326c3987faae7cbc20aae4c49e825c2b582
            netbox_input_sha256: 2cbc54404b9e1e0a700c416077069c79f2220005b977111da9da8d13b5a6e688
            netbox_lock: ci/netbox-requirements/v4.7.0-py312-linux-x86_64.txt
            netbox_lock_sha256: 1b389b1010274e31be11c4c82d5cd8c110a77d3d7ccb667b70c69d30c309f9f1
          - netbox: "v4.6.6"
            pdm: true
            profile: base
            netbox_ref: fb8c455ba61b57119a70670612dfdd05e8438b10
            netbox_version: "4.6.6"
            netbox_designation: ""
            netbox_requirements_sha256: 25eb62e54362568599c7701a528a7ac24dbe0400d5311fc496eab866bd6174b9
            netbox_input_sha256: 58bf25c4c923034bc02ab2535a6221f1485171617985b0969136776a21f86a96
            netbox_lock: ci/netbox-requirements/v4.6.6-pdm-3408441672bf-py312-linux-x86_64.txt
            netbox_lock_sha256: 8994b5db006872b2784e778d83d58ad02c615117571d4ea84daacab59cf0e424
          - netbox: "v4.7.0"
            pdm: false
            profile: all-companions
            all_companions: true
            netbox_ref: 5f06007e4c9bacc93ce17c1e645fc1143d60df3d
            netbox_version: "4.7.0"
            netbox_designation: ""
            netbox_requirements_sha256: 61589a94b25149765d230d3f33597326c3987faae7cbc20aae4c49e825c2b582
            netbox_input_sha256: 2cbc54404b9e1e0a700c416077069c79f2220005b977111da9da8d13b5a6e688
            netbox_lock: ci/netbox-requirements/v4.7.0-all-companions-py312-linux-x86_64.txt
            netbox_lock_sha256: e2f5e25817aa3cf3548e8a7a17cd8ae5ccbda2da466452aac07b38ff01b78177
            pdm_ref: c96b425b69677107635749860e240576e91041ee
            ceph_ref: 227f386148219522476423a85156a72ab215ece5
            pbs_ref: e00bdcab5fa519f6a2cd22d51fc329e0623af746
            packer_ref: 31f9ddf9652dbbbb9b34b83604acd888228caae7
          - netbox: "v4.7.0"
            pdm: false
            profile: openbao
            openbao: true
            netbox_ref: 5f06007e4c9bacc93ce17c1e645fc1143d60df3d
            netbox_version: "4.7.0"
            netbox_designation: ""
            netbox_requirements_sha256: 61589a94b25149765d230d3f33597326c3987faae7cbc20aae4c49e825c2b582
            netbox_input_sha256: 2cbc54404b9e1e0a700c416077069c79f2220005b977111da9da8d13b5a6e688
            netbox_lock: ci/netbox-requirements/v4.7.0-openbao-58677ef-py312-linux-x86_64.txt
            netbox_lock_sha256: 25554c1dd25bf42f8c52077f2f53799f62598915bc8332884dcd8184f2f302c7
            openbao_ref: 58677efdd595c34cf0d597ca3efa1951b05ea25e
            rpc_ref: eae471d601423195c28ffa8482422b4c1cb4344d

    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: netbox-proxbox
          persist-credentials: false

      - name: Checkout NetBox ${{ matrix.netbox }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox_ref }}
          path: netbox
          persist-credentials: false

      - name: Checkout supported PDM registry override
        if: matrix.pdm || matrix.all_companions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: emersonfelipesp/netbox-pdm
          ref: ${{ matrix.all_companions && matrix.pdm_ref || '3408441672bf849dfaf953d96d6e0ba1561cd576' }}
          path: netbox-pdm
          persist-credentials: false

      - name: Checkout supported Ceph companion
        if: matrix.all_companions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: emersonfelipesp/netbox-ceph
          ref: ${{ matrix.ceph_ref }}
          path: netbox-ceph
          persist-credentials: false

      - name: Verify COMPANION_READ_SSH_KEY for private PBS checkout
        if: matrix.all_companions
        env:
          COMPANION_READ_SSH_KEY: ${{ secrets.COMPANION_READ_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${COMPANION_READ_SSH_KEY}" ]]; then
            echo "::error::COMPANION_READ_SSH_KEY is not configured. The all_companions matrix cell needs this repository secret to checkout the private emersonfelipesp/netbox-pbs companion at the pinned commit."
            exit 1
          fi

      - name: Checkout supported PBS companion
        if: matrix.all_companions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: emersonfelipesp/netbox-pbs
          ref: ${{ matrix.pbs_ref }}
          path: netbox-pbs
          ssh-key: ${{ secrets.COMPANION_READ_SSH_KEY }}
          persist-credentials: false

      - name: Checkout supported Packer companion
        if: matrix.all_companions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: emersonfelipesp/netbox-packer
          ref: ${{ matrix.packer_ref }}
          path: netbox-packer
          persist-credentials: false

      - name: Checkout supported OpenBao companion
        if: matrix.openbao
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: emersonfelipesp/netbox-openbao
          ref: ${{ matrix.openbao_ref }}
          path: netbox-openbao
          persist-credentials: false

      - name: Checkout supported RPC dependency
        if: matrix.openbao
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: N-MultiCloud/netbox-rpc
          ref: ${{ matrix.rpc_ref }}
          path: netbox-rpc
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"

      - name: Verify exact NetBox source identity
        env:
          EXPECTED_NETBOX_REF: ${{ matrix.netbox_ref }}
          EXPECTED_NETBOX_TAG: ${{ matrix.netbox }}
          EXPECTED_NETBOX_VERSION: ${{ matrix.netbox_version }}
          EXPECTED_NETBOX_DESIGNATION: ${{ matrix.netbox_designation }}
          EXPECTED_REQUIREMENTS_SHA256: ${{ matrix.netbox_requirements_sha256 }}
          EXPECTED_INPUT_SHA256: ${{ matrix.netbox_input_sha256 }}
          EXPECTED_NETBOX_LOCK: ${{ matrix.netbox_lock }}
          EXPECTED_LOCK_SHA256: ${{ matrix.netbox_lock_sha256 }}
          EXPECTED_PROJECT_INPUT_SHA256: 431e09b72b9bfcba6e4e3776bd49a8449425dea345677c60ea12e7e839ca8b6a
          EXPECTED_PDM_INPUT_SHA256: 424c8807691eaa50c53762e6b1dbddbbe4489fe0b2a9bd15d142acb17699d50e
          EXPECTED_PDM_PYPROJECT_SHA256: 496d7924629f7aa98452d302a33ce9b47c1533079f4a4320b92ee8b18133cfce
          EXPECTED_ALL_COMPANIONS_INPUT_SHA256: 7b277c8c7baf88778fac40258dca059212097e36dede04d1250f920a3ec7994b
          EXPECTED_OPENBAO_INPUT_SHA256: 5c60d62b4e84eaff3350e37045edc8b208c3b28b144815772c7dda0b2f754d85
        run: |
          actual_ref="$(git -C netbox rev-parse HEAD)"
          test "$actual_ref" = "$EXPECTED_NETBOX_REF"
          git -C netbox fetch --force --no-tags origin \
            "refs/tags/$EXPECTED_NETBOX_TAG:refs/tags/$EXPECTED_NETBOX_TAG"
          tagged_ref="$(git -C netbox rev-parse "$EXPECTED_NETBOX_TAG^{commit}")"
          test "$tagged_ref" = "$EXPECTED_NETBOX_REF"
          printf '%s  %s\n' "$EXPECTED_REQUIREMENTS_SHA256" netbox/requirements.txt \
            | sha256sum --check --strict
          input_path="ci/netbox-requirements/${EXPECTED_NETBOX_TAG}-py312-linux-x86_64.in"
          printf '%s  %s\n' "$EXPECTED_INPUT_SHA256" "netbox-proxbox/$input_path" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_LOCK_SHA256" "netbox-proxbox/$EXPECTED_NETBOX_LOCK" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_PROJECT_INPUT_SHA256" \
            netbox-proxbox/ci/netbox-requirements/netbox-proxbox-test-py312.in \
            | sha256sum --check --strict
          if [[ "${{ matrix.pdm }}" == "true" ]]; then
            printf '%s  %s\n' "$EXPECTED_PDM_INPUT_SHA256" \
              netbox-proxbox/ci/netbox-requirements/netbox-pdm-3408441672bf-py312.in \
              | sha256sum --check --strict
            printf '%s  %s\n' "$EXPECTED_PDM_PYPROJECT_SHA256" netbox-pdm/pyproject.toml \
              | sha256sum --check --strict
          fi
          if [[ "${{ matrix.all_companions }}" == "true" ]]; then
            printf '%s  %s\n' "$EXPECTED_ALL_COMPANIONS_INPUT_SHA256" \
              netbox-proxbox/ci/netbox-requirements/netbox-all-companions-py312.in \
              | sha256sum --check --strict
            declare -A companion_refs=(
              [netbox-pdm]="${{ matrix.pdm_ref }}"
              [netbox-ceph]="${{ matrix.ceph_ref }}"
              [netbox-pbs]="${{ matrix.pbs_ref }}"
              [netbox-packer]="${{ matrix.packer_ref }}"
            )
            for companion in netbox-pdm netbox-ceph netbox-pbs netbox-packer; do
              test "$(git -C "$companion" rev-parse HEAD)" = "${companion_refs[$companion]}"
            done
            printf '%s  %s\n' bf9ff5877ba6a3257d01804b78128510ada750e70aa344316dbf181b71c00b46 \
              netbox-pdm/pyproject.toml | sha256sum --check --strict
            printf '%s  %s\n' 407633d87cc6fc096d0a3824e2eaa9efd4ceda7486f70b2b65197c30450e82d9 \
              netbox-ceph/pyproject.toml | sha256sum --check --strict
            printf '%s  %s\n' da206270a647fe3bb5a26e3cb1136e39d7344bef8375a5fb20e11637ff318e7e \
              netbox-pbs/pyproject.toml | sha256sum --check --strict
            printf '%s  %s\n' 5f1b95feee604e4f617bffa0bb6efa548c3f12e02b28c57902754f599ab964fe \
              netbox-packer/pyproject.toml | sha256sum --check --strict
          fi
          if [[ "${{ matrix.openbao }}" == "true" ]]; then
            printf '%s  %s\n' "$EXPECTED_OPENBAO_INPUT_SHA256" \
              netbox-proxbox/ci/netbox-requirements/netbox-openbao-58677ef-py312.in \
              | sha256sum --check --strict
            test "$(git -C netbox-openbao rev-parse HEAD)" = "${{ matrix.openbao_ref }}"
            test "$(git -C netbox-rpc rev-parse HEAD)" = "${{ matrix.rpc_ref }}"
            printf '%s  %s\n' 9f5d28152a617adc85a5b986dcf6f4c896620618c74e661faf2d7f4c13f72b60 \
              netbox-openbao/pyproject.toml | sha256sum --check --strict
            printf '%s  %s\n' 1ca5be578acaae8d12261e559c93c2ff63c5bf81d1dbe782b2d79465400eb2f2 \
              netbox-rpc/pyproject.toml | sha256sum --check --strict
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          release = {}
          for line in Path("netbox/netbox/release.yaml").read_text().splitlines():
              key, separator, value = line.partition(":")
              if separator:
                  release[key.strip()] = value.strip().strip("\"'")

          actual_version = release.get("version", "")
          actual_designation = release.get("designation", "")
          expected_version = os.environ["EXPECTED_NETBOX_VERSION"]
          expected_designation = os.environ["EXPECTED_NETBOX_DESIGNATION"]
          expected_tag = os.environ["EXPECTED_NETBOX_TAG"].removeprefix("v")
          expected_full_version = expected_version
          if expected_designation:
              expected_full_version += f"-{expected_designation}"

          assert actual_version == expected_version, (actual_version, expected_version)
          assert actual_designation == expected_designation, (
              actual_designation,
              expected_designation,
          )
          assert expected_full_version == expected_tag, (
              expected_full_version,
              expected_tag,
          )
          PY

      - name: Set up locked Python installer
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: netbox-proxbox/uv.lock

      - name: Install NetBox and plugin
        working-directory: netbox-proxbox
        run: |
          # The row lock resolves plugin runtime/test metadata together with
          # exact NetBox metadata and, where enabled, pinned PDM metadata.
          uv venv --python 3.12.13
          uv pip install --python .venv/bin/python \
            --require-hashes \
            --default-index https://pypi.org/simple \
            --index-strategy first-index \
            -r "${{ matrix.netbox_lock }}"
          uv pip install --python .venv/bin/python --no-build-isolation --no-deps -e .
          if [[ "${{ matrix.pdm }}" == "true" || "${{ matrix.all_companions }}" == "true" ]]; then
            uv pip install --python .venv/bin/python \
              --no-build-isolation --no-deps -e ../netbox-pdm
          fi
          if [[ "${{ matrix.all_companions }}" == "true" ]]; then
            for companion in netbox-ceph netbox-pbs netbox-packer; do
              uv pip install --python .venv/bin/python \
                --no-build-isolation --no-deps -e "../$companion"
            done
          fi
          if [[ "${{ matrix.openbao }}" == "true" ]]; then
            uv pip install --python .venv/bin/python \
              --no-build-isolation --no-deps -e ../netbox-rpc
            uv pip install --python .venv/bin/python \
              --no-build-isolation --no-deps -e ../netbox-openbao
          fi
          uv pip check --python .venv/bin/python

      - name: Prove official NetBox 4.7.0 GA loader identity
        if: matrix.netbox == 'v4.7.0' && !matrix.pdm && !matrix.all_companions
        working-directory: netbox-proxbox
        env:
          NETBOX_CONFIGURATION: tests.netbox_test_configuration
          DJANGO_SETTINGS_MODULE: netbox.settings
          PYTHONPATH: ${{ github.workspace }}/netbox/netbox:${{ github.workspace }}/netbox-proxbox
        run: |
          set -euo pipefail
          manage=(.venv/bin/python ../netbox/netbox/manage.py)
          "${manage[@]}" check
          "${manage[@]}" shell -c '
          from netbox.registry import registry
          from utilities.release import load_release_data

          release = load_release_data()
          assert "netbox_proxbox" in registry["plugins"]["installed"]
          assert release.version == "4.7.0"
          assert release.designation is None
          assert release.full_version == "4.7.0"
          '
          test -z "$(git -C ../netbox status --porcelain --untracked-files=all)"

      - name: Prove the combined NetBox 4.7 companion registry
        if: matrix.all_companions
        working-directory: netbox-proxbox
        env:
          NETBOX_CONFIGURATION: tests.netbox_test_configuration
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_PROXBOX_TEST_ALL_COMPANIONS: "1"
          PYTHONPATH: ${{ github.workspace }}/netbox/netbox:${{ github.workspace }}/netbox-proxbox
        run: |
          set -euo pipefail
          manage=(.venv/bin/python ../netbox/netbox/manage.py)
          "${manage[@]}" migrate --noinput
          "${manage[@]}" check
          "${manage[@]}" shell -c '
          from django.apps import apps
          from django.core.checks import run_checks
          from netbox.registry import registry

          expected = {"netbox_proxbox", "netbox_ceph", "netbox_pbs", "netbox_pdm", "netbox_packer"}
          installed = set(registry["plugins"]["installed"])
          assert expected <= installed, (expected, installed)
          for plugin in expected:
              assert apps.is_installed(plugin), plugin
          plugin_messages = [
              message for message in run_checks()
              if str(getattr(message, "id", "")).partition(".")[0] in expected
          ]
          assert plugin_messages == [], plugin_messages
          '

      - name: Run NetBox-backed model, view, and integration tests
        working-directory: netbox-proxbox
        env:
          # pytest-django and tests/test_sync_state_models.py both use these.
          # The NetBox test configuration (netbox.configuration_testing)
          # points DB/redis at localhost with the netbox/netbox credentials
          # created by the service containers above.
          NETBOX_CONFIGURATION: tests.netbox_test_configuration
          DJANGO_SETTINGS_MODULE: netbox.settings
          # Make a missing/broken NetBox harness a hard failure here instead of
          # a silent skip, so this job genuinely gates merges.
          NETBOX_PROXBOX_REQUIRE_DJANGO: "1"
          NETBOX_SOURCE_ROOT: ${{ github.workspace }}/netbox/netbox
          NETBOX_PROXBOX_TEST_PDM: ${{ matrix.pdm && '1' || '0' }}
          NETBOX_PROXBOX_TEST_ALL_COMPANIONS: ${{ matrix.all_companions && '1' || '0' }}
          NETBOX_PROXBOX_TEST_OPENBAO: ${{ matrix.openbao && '1' || '0' }}

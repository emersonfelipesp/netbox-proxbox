---
name: CI

# Authoritative lightweight Gitea pre-merge gate. Pull-request code runs only
# on the unprivileged Python runner. Real NetBox/PostgreSQL/Redis compatibility
# remains in GitHub's django-tests matrix because this runner has no services.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # One active CI run per repository: all refs share this capacity-bounded host.
  group: netbox-proxbox-ci
  # Never let feature-branch churn cancel protected-branch or immutable-tag evidence.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Static checks and mocked regressions
    runs-on: ci-untrusted-python312
    timeout-minutes: 35
    env:
      HOME: ${{ github.workspace }}
      UV_NO_CACHE: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reset generated workspace state
        shell: bash
        run: bash ci/clean-generated-workspace.sh startup

      - name: Install locked quality and test environment
        shell: bash
        run: |
          set -euo pipefail
          command -v uv
          required_kib=393216
          available_kib="$(df -Pk . | awk 'NR == 2 {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          printf 'runner_capacity available_kib=%s required_kib=%s\n' \
            "$available_kib" "$required_kib"
          test "$available_kib" -ge "$required_kib"
          uv venv --python 3.12 .venv
          # The optional `dev` extra owns lint/type tools. The dependency-group
          # named `dev` owns MkDocs and belongs only in docs-and-package.
          uv sync --no-dev --extra test --extra dev --extra cli --locked

      - name: Ruff lint and format
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type-check the standalone CLI
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/ty check proxbox_cli

      - name: Compile Python sources and tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q netbox_proxbox proxbox_cli tests

      - name: Run mocked suite
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -p no:django -q -rs tests

      - name: Clean quality environment
        if: always()
        shell: bash
        run: bash ci/clean-generated-workspace.sh cleanup

  docs-and-package:
    name: Strict docs and package validation
    # Both jobs share one capacity-bounded runner host. Avoid two concurrent
    # locked environments and their extraction scratch space.
    needs: quality
    runs-on: ci-untrusted-python312
    timeout-minutes: 30
    env:
      HOME: ${{ github.workspace }}
      UV_NO_CACHE: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reset generated workspace state
        shell: bash
        run: bash ci/clean-generated-workspace.sh startup

      - name: Install documentation and packaging environment
        shell: bash
        run: |
          set -euo pipefail
          command -v uv
          required_kib=393216
          available_kib="$(df -Pk . | awk 'NR == 2 {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          printf 'runner_capacity available_kib=%s required_kib=%s\n' \
            "$available_kib" "$required_kib"
          test "$available_kib" -ge "$required_kib"
          uv venv --python 3.12 .venv
          uv sync --group dev --group publish --locked

      - name: Build strict documentation
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/mkdocs build --strict --site-dir .ci-site

      - name: Build and check distribution
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m build --no-isolation
          .venv/bin/twine check dist/*

      - name: Clean docs and package environment
        if: always()
        shell: bash
        run: bash ci/clean-generated-workspace.sh cleanup

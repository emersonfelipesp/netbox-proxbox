---
name: CI

# Authoritative lightweight Gitea pre-merge gate. Pull-request code runs only
# on the unprivileged Python runner. Real NetBox/PostgreSQL/Redis compatibility
# remains in GitHub's django-tests matrix because this runner has no services.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # One group per ref. Gitea (1.26) does not queue a second pending run behind
  # the first in a group: at most one run per group may be pending, and the
  # documented rule is that a new pending run replaces the older one (in the
  # 2026-09-14 incident, with the older run stuck in an inconsistent queued
  # state, it was the arriving runs that ended up cancelled). Either way, a
  # group shared across refs makes one pull request's pending run and
  # another's mutually destructive. Runs from different refs may now overlap
  # up to the runner's capacity; a capacity-1 lane is the durable
  # serialisation and is a runner-host setting, not something this file can
  # provide.
  group: netbox-proxbox-ci-${{ github.ref }}
  # Never let a newer push cancel in-progress protected-branch or
  # immutable-tag evidence; a newer pending run on the same ref replaces the
  # older pending one anyway.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Static checks and mocked regressions
    runs-on: ci-untrusted-python312
    timeout-minutes: 35
    env:
      HOME: ${{ github.workspace }}
      UV_NO_CACHE: "1"
      UV_PYTHON_DOWNLOADS: never
      # The untrusted runner exports none of the usual CI markers, so the
      # public-disclosure guard in tests/test_release_workflows.py is told
      # explicitly that it runs in CI, which event it is reviewing, and — for
      # a branch push, whose base is the branch's previous tip — that tip.
      CI: "true"
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_BASE_REF: ${{ github.base_ref }}
      GITHUB_REF: ${{ github.ref }}
      PROXBOX_REVIEW_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The public-disclosure guard in tests/test_release_workflows.py
          # diffs this branch against its base; a shallow clone has no base.
          fetch-depth: 0

      - name: Reset generated workspace state
        shell: bash
        run: bash ci/clean-generated-workspace.sh startup

      - name: Install locked quality and test environment
        shell: bash
        run: |
          set -euo pipefail
          command -v uv
          # The disclosure guard in tests/test_release_workflows.py keys its
          # fail-closed path on these markers; print them so a run's log shows
          # which ones this runner exports.
          env | grep -E '^(CI|GITHUB_ACTIONS|GITEA_ACTIONS|GITHUB_EVENT_NAME)=' || true
          required_kib=393216
          available_kib="$(df -Pk . | awk 'NR == 2 {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          printf 'runner_capacity available_kib=%s required_kib=%s\n' \
            "$available_kib" "$required_kib"
          test "$available_kib" -ge "$required_kib"
          uv venv --python 3.12 .venv
          # The optional `dev` extra owns lint/type tools. The dependency-group
          # named `dev` owns MkDocs and belongs only in docs-and-package.
          uv sync --no-dev --extra test --extra dev --extra cli --locked

      - name: Ruff lint and format
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type-check the standalone CLI
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/ty check proxbox_cli

      - name: Compile Python sources and tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q netbox_proxbox proxbox_cli tests

      - name: Enforce public repository boundary
        shell: bash
        run: .venv/bin/python scripts/check_public_boundary.py

      - name: Run mocked suite
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -p no:django -q -rs tests

      - name: Clean quality environment
        if: always()
        shell: bash
        run: bash ci/clean-generated-workspace.sh cleanup

  docs-and-package:
    name: Strict docs and package validation
    # Both jobs share one capacity-bounded runner host. Avoid two concurrent
    # locked environments and their extraction scratch space.
    needs: quality
    runs-on: ci-untrusted-python312
    timeout-minutes: 30
    env:
      HOME: ${{ github.workspace }}
      UV_NO_CACHE: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reset generated workspace state
        shell: bash
        run: bash ci/clean-generated-workspace.sh startup

      - name: Install documentation and packaging environment
        shell: bash
        run: |
          set -euo pipefail
          command -v uv
          required_kib=393216
          available_kib="$(df -Pk . | awk 'NR == 2 {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          printf 'runner_capacity available_kib=%s required_kib=%s\n' \
            "$available_kib" "$required_kib"
          test "$available_kib" -ge "$required_kib"
          uv venv --python 3.12 .venv
          uv sync --group dev --group publish --locked

      - name: Build strict documentation
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/mkdocs build --strict --site-dir .ci-site

      - name: Build and check distribution
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m build --no-isolation
          .venv/bin/python scripts/check_dist_inventory.py dist/*.whl dist/*.tar.gz
          .venv/bin/python scripts/verify_vm_console_artifacts.py dist
          .venv/bin/twine check dist/*

      - name: Clean docs and package environment
        if: always()
        shell: bash
        run: bash ci/clean-generated-workspace.sh cleanup

name: Gitea Package Registry — Publish

on:
  # Deliberately `push` only. Gitea emits both `create` and `push` for a tag;
  # subscribing to both starts two immutable package uploads for one version.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (e.g. v0.0.16rc1 or v0.0.16)'
        required: true

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_rc: ${{ steps.extract.outputs.is_rc }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Determine tag
        id: resolve_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.post[0-9]+)?$'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! echo "${TAG}" | grep -qE "${TAG_PATTERN}"; then
            echo "ERROR: tag '${TAG}' does not match expected pattern ${TAG_PATTERN}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}

      - id: extract
        name: Extract and validate version
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if echo "${VERSION}" | grep -qE 'rc[0-9]+$'; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
            echo "RC release: ${VERSION}"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
            echo "Official release: ${VERSION}"
          fi
          # Validate pyproject.toml matches tag
          PYVER=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "${VERSION}" != "${PYVER}" ]; then
            echo "ERROR: tag ${TAG} (${VERSION}) does not match pyproject.toml version ${PYVER}"
            exit 1
          fi
          echo "Version ${VERSION} validated against pyproject.toml"
          # Validate __init__.py version matches
          if [ -f "netbox_proxbox/__init__.py" ]; then
            INITVER=$(grep 'version = ' netbox_proxbox/__init__.py | grep -v '#' | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "${VERSION}" != "${INITVER}" ]; then
              echo "ERROR: tag ${TAG} (${VERSION}) does not match __init__.py version ${INITVER}"
              exit 1
            fi
            echo "Version ${VERSION} validated against __init__.py"
          fi


  publish-gitea:
    needs: validate-version
    if: ${{ needs.validate-version.outputs.version != '' }}
    runs-on: mirror-host
    env:
      HOME: /root
      VERSION: ${{ needs.validate-version.outputs.version }}
      TAG: ${{ needs.validate-version.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.tag }}

      - name: Install build tools
        env:
          # Pinned deliberately. The previous bootstrap fetched whatever the
          # unversioned installer served and then accepted whatever answered
          # `uv --version`, so two builds of one tag could come from different
          # toolchains -- and this path is live: the runner that failed this
          # release had no uv at all.
          UV_VERSION: "0.12.5"
        run: |
          set -euo pipefail
          # Assert the tools the *post-upload* verification needs, on the
          # default PATH it will actually run with, before anything is built.
          # The verifier is a fresh shell -- it does not inherit the PATH export
          # below -- and it uses both curl and python3. A user-local python3
          # visible only to this step would pass a naive check here and be
          # missing there, after an immutable version had been consumed.
          for tool in python3 curl; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "ERROR: ${tool} is required by the post-upload registry verification"
              exit 1
            }
          done
          python3 --version
          curl --version | head -1

          uv_is_pinned() {
            command -v uv >/dev/null 2>&1 && \
              [ "$(uv --version 2>/dev/null | awk '{print $2}')" = "${UV_VERSION}" ]
          }
          if ! uv_is_pinned; then
            curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" \
              | sh -s -- --no-modify-path
            export PATH="${HOME}/.local/bin:${PATH}"
          fi
          export PATH="${HOME}/.local/bin:${PATH}"
          ACTUAL_UV="$(uv --version | awk '{print $2}')"
          if [ "${ACTUAL_UV}" != "${UV_VERSION}" ]; then
            echo "ERROR: expected uv ${UV_VERSION}, got ${ACTUAL_UV}"
            exit 1
          fi
          uv --version

      - name: Build distributions
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          # Build and upload from the repository's own locked `publish` group
          # rather than resolving a backend and an ephemeral twine at run time.
          # `uv.lock` carries hashes for that group, so the PEP 517 backend and
          # the credential-bearing uploader are the reviewed, pinned ones
          # (hatchling 1.31.0, twine 6.2.0) instead of whatever resolution
          # happens to pick on the day.
          uv sync --only-group publish --locked --no-install-project
          uv build
          ls dist/

      - name: Build release manifest
        run: |
          set -euo pipefail
          # Bind the artifacts to the tagged commit before either is uploaded.
          # `fetch-gitea` -- the deploy and promotion consumer -- compares the
          # manifest's `source_sha` against the tag it was asked to deploy, so
          # the value must be the commit the tag resolves to, not the tag
          # object's own SHA. `^{commit}` peels an annotated tag; a lightweight
          # tag already points at the commit and is unaffected.
          SOURCE_SHA="$(git rev-parse "${TAG}^{commit}")"
          PKG_NAME=$(grep '^name' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          python3 scripts/release_artifacts.py manifest \
            --dist dist \
            --package "${PKG_NAME}" \
            --version "${VERSION}" \
            --source-sha "${SOURCE_SHA}" \
            --manifest release-manifest.json
          echo "Release manifest built for ${PKG_NAME} ${VERSION} at ${SOURCE_SHA}"

      - name: Publish to Gitea Package Registry
        env:
          TWINE_USERNAME: emersonfelipesp
          TWINE_PASSWORD: ${{ secrets.PKG_TOKEN }}
          TWINE_REPOSITORY_URL: https://git.nmulti.cloud/api/packages/emersonfelipesp/pypi
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          # The pinned twine from the locked `publish` group synced above; the
          # previous `--with twine` resolved a separate ephemeral layer at run
          # time, and that layer ran with the registry credential.
          .venv/bin/python -m twine upload --non-interactive dist/*

      - name: Verify package in Gitea registry
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        run: |
          set -euo pipefail
          # Verified against the manifest rather than by counting search hits.
          # The previous check listed the owner's packages and counted entries
          # whose version matched, which any package of any name at that
          # version satisfies -- so it could pass while this package's own
          # upload was absent, incomplete, or carrying different bytes. Since
          # the very next step publishes the manifest as the provenance record
          # every deploy and promotion verifies against, that gate has to prove
          # the exact artifact set is present, with the exact sizes and digests
          # the manifest recorded.
          PKG_NAME=$(grep '^name' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          sleep 5
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # The forge origin comes from the runner rather than being written
          # down here. release_artifacts still pins the permitted origin
          # itself, so a wrong value fails closed rather than reaching an
          # unexpected host.
          python3 scripts/release_artifacts.py verify-registry \
            --registry "${GITHUB_SERVER_URL}/api/v1/packages/" \
            --owner emersonfelipesp \
            --repository "${REPO_NAME}" \
            --package "${PKG_NAME}" \
            --version "${VERSION}" \
            --manifest release-manifest.json
          echo "Package ${PKG_NAME} ${VERSION} matches the release manifest in Gitea"

      - name: Publish release manifest
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        run: |
          set -euo pipefail
          # Published last, deliberately. The manifest asserts that this exact
          # artifact set exists for this version, so it must not appear for a
          # version whose wheel/sdist upload failed or was never verified --
          # `latest_package` treats the manifest's presence as the signal that
          # a version is deployable. The helper uploads the canonical bytes,
          # links the package to this repository (repository linkage is what
          # `fetch-gitea` checks; an unlinked package is rejected), and reads
          # the result back, failing if the stored bytes differ from what was
          # sent.
          #
          # If this step fails after the wheel and sdist are already uploaded,
          # the version is consumed without a manifest and is not deployable
          # through the package source. Do NOT try to repair it by re-running
          # with the upload skipped: package versions here are immutable and
          # this repository's release policy is fix-forward -- bump to the next
          # rcN or .postN, which republishes both artifacts and a manifest
          # together. That is the same property every post-upload step in this
          # workflow already has (the GitHub tag push and release creation sit
          # after the upload for the same reason), so this step introduces no
          # new class of failure. Reusing a consumed version is prohibited
          # repository-wide and a contract test enforces that the upload never
          # tolerates an already-published version.
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          python3 scripts/release_artifacts.py publish-manifest \
            --registry "${GITHUB_SERVER_URL}/api/v1/packages/" \
            --owner emersonfelipesp \
            --repository "${REPO_NAME}" \
            --manifest release-manifest.json
          echo "Release manifest published and verified for ${VERSION}"

  push-to-github:
    needs: [validate-version, publish-gitea]
    if: ${{ needs.validate-version.outputs.version != '' }}
    runs-on: mirror-host
    env:
      HOME: /root
      VERSION: ${{ needs.validate-version.outputs.version }}
      TAG: ${{ needs.validate-version.outputs.tag }}
      IS_RC: ${{ needs.validate-version.outputs.is_rc }}
      GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
    steps:
      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          # Best-effort for the same reason as the build job's bootstrap -- and
          # it matters more here, because this job runs *after* the package has
          # been uploaded. A broken third-party APT source would strand an
          # already-published immutable version with no tag or release on
          # GitHub, and a re-run would then collide with that upload. The
          # `apt-get install` calls below remain the real gate, as does the
          # closing `gh --version`.
          apt-get update -qq || true
          apt-get install -y ca-certificates curl gnupg
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          apt-get update -qq || true
          apt-get install -y gh
          gh --version

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Push tag to GitHub
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          git config user.email "gitea-actions@git.nmulti.cloud"
          git config user.name "Gitea Actions"
          gh auth setup-git --hostname github.com --force
          git remote add github "https://github.com/emersonfelipesp/${REPO_NAME}.git" \
            || git remote set-url github "https://github.com/emersonfelipesp/${REPO_NAME}.git"
          git push github "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "Tag ${TAG} pushed to GitHub"

      - name: Create GitHub Release (non-RC only)
        if: env.IS_RC == 'false'
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          GH_REPO="emersonfelipesp/${REPO_NAME}"
          NOTES_FILE="docs/release-notes/version-${VERSION}.md"
          if [ -f "${NOTES_FILE}" ]; then
            NOTES_ARGS="--notes-file ${NOTES_FILE}"
          else
            NOTES_ARGS="--generate-notes"
          fi
          TARGET_BRANCH="develop"
          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — ensuring it is not a draft"
            gh release edit "${TAG}" --repo "${GH_REPO}" --draft=false
            echo "Release ${TAG} published (was draft)"
          else
            gh release create "${TAG}" \
              --repo "${GH_REPO}" \
              --target "${TARGET_BRANCH}" \
              --title "${TAG}" \
              ${NOTES_ARGS}
            echo "GitHub release ${TAG} created for ${GH_REPO}"
          fi

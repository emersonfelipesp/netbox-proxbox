name: Gitea Package Registry — Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: private-package-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate canonical release source
    runs-on: ci-untrusted-python312
    outputs:
      is_rc: ${{ steps.policy.outputs.is_rc }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
      tag: ${{ steps.policy.outputs.tag }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Checkout release source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind tag, version, canonical develop, and successful CI
        id: policy
        env:
          GITEA_API_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]* | v[0-9]*.[0-9]*.[0-9]*rc[0-9]* | v[0-9]*.[0-9]*.[0-9]*.post[0-9]*) ;;
            *) echo "Invalid release tag: $TAG"; exit 1 ;;
          esac
          git fetch --force --no-tags origin \
            "+refs/heads/develop:refs/remotes/gitea/release-develop" \
            "+refs/tags/${TAG}:refs/release-policy/candidate"
          SOURCE_SHA="$(git rev-parse refs/release-policy/candidate^{commit})"
          DEVELOP_SHA="$(git rev-parse refs/remotes/gitea/release-develop^{commit})"
          test "$SOURCE_SHA" = "$DEVELOP_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD^{commit})"
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import ast
          import pathlib
          import re
          import sys
          import tomllib

          version = sys.argv[1]
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:rc[1-9][0-9]*|\.post[1-9][0-9]*)?", version) is None:
              raise SystemExit("Release version is not canonical")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          if project["project"]["name"] != "netbox-proxbox":
              raise SystemExit("Unexpected package identity")
          if project["project"]["version"] != version:
              raise SystemExit("Tag and pyproject version differ")
          tree = ast.parse(pathlib.Path("netbox_proxbox/__init__.py").read_text())
          values = [
              ast.literal_eval(node.value)
              for cls in tree.body
              if isinstance(cls, ast.ClassDef) and cls.name == "ProxboxConfig"
              for node in cls.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "version" for target in node.targets)
          ]
          if values != [version]:
              raise SystemExit("Runtime plugin version differs from tag")
          PY
          python3 scripts/gitea_ci_gate.py \
            --owner emersonfelipesp --repository netbox-proxbox \
            --source-sha "$SOURCE_SHA" --trusted-actor emersonfelipesp \
            --required-context "CI / Static checks and mocked regressions (push)" \
            --required-context "CI / Strict docs and package validation (push)"
          printf 'tag=%s\nversion=%s\nsource_sha=%s\n' "$TAG" "$VERSION" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *rc[0-9]*) echo 'is_rc=true' >> "$GITHUB_OUTPUT" ;; *) echo 'is_rc=false' >> "$GITHUB_OUTPUT" ;; esac

  build-candidate:
    name: Build credential-free candidate
    needs: validate-source
    runs-on: ci-untrusted-python312
    steps:
      - name: Checkout validated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-source.outputs.source_sha }}
          persist-credentials: false

      - name: Install checksum-verified uv and managed Python
        env:
          BOOTSTRAP_UV_ROOT: ${{ runner.temp }}/netbox-proxbox-uv-build-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_PYTHON_ROOT: ${{ runner.temp }}/netbox-proxbox-python-build-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_CACHE_ROOT: ${{ runner.temp }}/netbox-proxbox-uv-cache-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$BOOTSTRAP_UV_ROOT"
          test ! -e "$BOOTSTRAP_PYTHON_ROOT"
          test ! -e "$BOOTSTRAP_CACHE_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_UV_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_PYTHON_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_CACHE_ROOT"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$BOOTSTRAP_UV_ROOT/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.11.28/uv-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224 \
            "$BOOTSTRAP_UV_ROOT/uv.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$BOOTSTRAP_UV_ROOT/uv.tar.gz" \
            --directory "$BOOTSTRAP_UV_ROOT" --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv
          chmod 0555 "$BOOTSTRAP_UV_ROOT/uv"
          printf 'UV_BIN=%s\n' "$BOOTSTRAP_UV_ROOT/uv" >> "$GITHUB_ENV"
          printf 'UV_PYTHON_INSTALL_DIR=%s\n' "$BOOTSTRAP_PYTHON_ROOT" >> "$GITHUB_ENV"
          while IFS='=' read -r VARIABLE _; do
            case "$VARIABLE" in UV_*) unset "$VARIABLE" ;; esac
          done < <(env)
          "$BOOTSTRAP_UV_ROOT/uv" python install \
            --no-config \
            --cache-dir "$BOOTSTRAP_CACHE_ROOT" \
            --install-dir "$BOOTSTRAP_PYTHON_ROOT" \
            --managed-python \
            --no-bin \
            3.12.13

      - name: Prepare locked release tools
        env:
          BUILD_ROOT: ${{ runner.temp }}/netbox-proxbox-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          PUBLISHER_UV="$UV_BIN"
          MANAGED_PYTHON_ROOT="$UV_PYTHON_INSTALL_DIR"
          while IFS='=' read -r VARIABLE _; do
            case "$VARIABLE" in UV_*) unset "$VARIABLE" ;; esac
          done < <(env)
          test ! -e "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          UV_PYTHON_INSTALL_DIR="$MANAGED_PYTHON_ROOT" \
            UV_PROJECT_ENVIRONMENT="$BUILD_ROOT/venv" \
            "$PUBLISHER_UV" sync \
            --no-config \
            --cache-dir "$BUILD_ROOT/uv-cache" \
            --managed-python \
            --no-python-downloads \
            --python 3.12.13 \
            --locked --only-group publish --no-install-project
          test "$("$PUBLISHER_UV" --version)" = "uv 0.11.28 (x86_64-unknown-linux-gnu)"
          test "$("$BUILD_ROOT/venv/bin/python" -c 'import platform; print(platform.python_version())')" = 3.12.13
          case "$(readlink -f "$BUILD_ROOT/venv/bin/python")" in
            "$MANAGED_PYTHON_ROOT"/*) ;;
            *) exit 1 ;;
          esac

      - name: Build and bind exact artifacts
        env:
          BUILD_ROOT: ${{ runner.temp }}/netbox-proxbox-build-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          "$BUILD_ROOT/venv/bin/python" -m build --no-isolation --outdir dist
          "$BUILD_ROOT/venv/bin/python" -m twine check dist/*
          "$BUILD_ROOT/venv/bin/python" scripts/release_artifacts.py manifest \
            --dist dist --package netbox-proxbox --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --manifest release-manifest.json
          mkdir release-transfer
          cp dist/*.whl dist/*.tar.gz release-manifest.json \
            scripts/release_artifacts.py release-transfer/

      - name: Transfer bounded candidate
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: private-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-transfer
          if-no-files-found: error
          retention-days: 1

  verify-candidate:
    name: Verify candidate without package authority
    needs: [validate-source, build-candidate]
    runs-on: ci-untrusted-python312
    permissions:
      contents: read
      packages: read
    steps:
      - name: Fetch validated publisher tool anonymously
        env:
          TOOL_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test ! -e publisher-tool
          git init publisher-tool
          git -C publisher-tool remote add origin \
            https://git.nmulti.cloud/emersonfelipesp/netbox-proxbox.git
          git -C publisher-tool fetch --force --no-tags origin "$TOOL_SHA"
          git -C publisher-tool checkout --detach FETCH_HEAD
          test "$(git -C publisher-tool rev-parse HEAD)" = "$TOOL_SHA"

      - name: Install checksum-verified uv and managed Python
        env:
          BOOTSTRAP_UV_ROOT: ${{ runner.temp }}/netbox-proxbox-uv-publish-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_PYTHON_ROOT: ${{ runner.temp }}/netbox-proxbox-python-publish-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_CACHE_ROOT: ${{ runner.temp }}/netbox-proxbox-uv-cache-publish-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$BOOTSTRAP_UV_ROOT"
          test ! -e "$BOOTSTRAP_PYTHON_ROOT"
          test ! -e "$BOOTSTRAP_CACHE_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_UV_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_PYTHON_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_CACHE_ROOT"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$BOOTSTRAP_UV_ROOT/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.11.28/uv-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224 \
            "$BOOTSTRAP_UV_ROOT/uv.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$BOOTSTRAP_UV_ROOT/uv.tar.gz" \
            --directory "$BOOTSTRAP_UV_ROOT" --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv
          chmod 0555 "$BOOTSTRAP_UV_ROOT/uv"
          printf 'UV_BIN=%s\n' "$BOOTSTRAP_UV_ROOT/uv" >> "$GITHUB_ENV"
          printf 'UV_PYTHON_INSTALL_DIR=%s\n' "$BOOTSTRAP_PYTHON_ROOT" >> "$GITHUB_ENV"
          while IFS='=' read -r VARIABLE _; do
            case "$VARIABLE" in UV_*) unset "$VARIABLE" ;; esac
          done < <(env)
          "$BOOTSTRAP_UV_ROOT/uv" python install \
            --no-config \
            --cache-dir "$BOOTSTRAP_CACHE_ROOT" \
            --install-dir "$BOOTSTRAP_PYTHON_ROOT" \
            --managed-python \
            --no-bin \
            3.12.13

      - name: Download bounded candidate
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b # v3.1.0-node20
        with:
          name: private-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-transfer

      - name: Install locked publisher toolchain without package authority
        env:
          PUBLISH_ROOT: ${{ runner.temp }}/netbox-proxbox-publish-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          PUBLISHER_UV="$UV_BIN"
          MANAGED_PYTHON_ROOT="$UV_PYTHON_INSTALL_DIR"
          while IFS='=' read -r VARIABLE _; do
            case "$VARIABLE" in UV_*) unset "$VARIABLE" ;; esac
          done < <(env)
          test ! -e "$PUBLISH_ROOT"
          mkdir -p "$PUBLISH_ROOT"
          UV_PYTHON_INSTALL_DIR="$MANAGED_PYTHON_ROOT" \
            UV_PROJECT_ENVIRONMENT="$PUBLISH_ROOT/venv" \
            "$PUBLISHER_UV" sync \
            --directory publisher-tool \
            --no-config \
            --cache-dir "$PUBLISH_ROOT/uv-cache" \
            --managed-python \
            --no-python-downloads \
            --python 3.12.13 \
            --locked --only-group publish --no-install-project
          test "$("$PUBLISHER_UV" --version)" = "uv 0.11.28 (x86_64-unknown-linux-gnu)"
          test "$("$PUBLISH_ROOT/venv/bin/python" -c 'import platform; print(platform.python_version())')" = 3.12.13
          case "$(readlink -f "$PUBLISH_ROOT/venv/bin/python")" in
            "$MANAGED_PYTHON_ROOT"/*) ;;
            *) exit 1 ;;
          esac
          printf 'PUBLISHER_PYTHON=%s\n' "$PUBLISH_ROOT/venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify candidate with its reviewed release tooling
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          mv release-transfer/*.whl release-transfer/*.tar.gz dist/
          cmp publisher-tool/scripts/release_artifacts.py \
            release-transfer/release_artifacts.py
          "$PUBLISHER_PYTHON" publisher-tool/scripts/release_artifacts.py verify \
            --dist dist --package netbox-proxbox --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --manifest release-transfer/release-manifest.json

      - name: Transfer data-only verified candidate
        run: |
          set -euo pipefail
          mkdir verified-transfer
          cp dist/*.whl dist/*.tar.gz release-transfer/release-manifest.json \
            verified-transfer/

      - name: Upload data-only verified candidate
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: verified-private-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-transfer
          if-no-files-found: error
          retention-days: 1

  publish-gitea:
    name: Publish from isolated credential boundary
    needs: [validate-source, verify-candidate]
    runs-on: release-publisher
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install checksum-verified uv and managed Python
        env:
          BOOTSTRAP_UV_ROOT: ${{ runner.temp }}/netbox-proxbox-uv-credential-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_PYTHON_ROOT: ${{ runner.temp }}/netbox-proxbox-python-credential-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_CACHE_ROOT: ${{ runner.temp }}/netbox-proxbox-uv-cache-credential-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$BOOTSTRAP_UV_ROOT"
          test ! -e "$BOOTSTRAP_PYTHON_ROOT"
          test ! -e "$BOOTSTRAP_CACHE_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_UV_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_PYTHON_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_CACHE_ROOT"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$BOOTSTRAP_UV_ROOT/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.11.28/uv-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224 \
            "$BOOTSTRAP_UV_ROOT/uv.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$BOOTSTRAP_UV_ROOT/uv.tar.gz" \
            --directory "$BOOTSTRAP_UV_ROOT" --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv
          chmod 0555 "$BOOTSTRAP_UV_ROOT/uv"
          printf 'UV_BIN=%s\n' "$BOOTSTRAP_UV_ROOT/uv" >> "$GITHUB_ENV"
          printf 'UV_PYTHON_INSTALL_DIR=%s\n' "$BOOTSTRAP_PYTHON_ROOT" >> "$GITHUB_ENV"
          while IFS='=' read -r VARIABLE _; do
            case "$VARIABLE" in UV_*) unset "$VARIABLE" ;; esac
          done < <(env)
          "$BOOTSTRAP_UV_ROOT/uv" python install \
            --no-config \
            --cache-dir "$BOOTSTRAP_CACHE_ROOT" \
            --install-dir "$BOOTSTRAP_PYTHON_ROOT" \
            --managed-python \
            --no-bin \
            3.12.13

      - name: Install fixed publisher executable without candidate files
        env:
          PUBLISH_ROOT: ${{ runner.temp }}/netbox-proxbox-credential-tool-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          PUBLISHER_UV="$UV_BIN"
          MANAGED_PYTHON_ROOT="$UV_PYTHON_INSTALL_DIR"
          while IFS='=' read -r VARIABLE _; do
            case "$VARIABLE" in UV_*) unset "$VARIABLE" ;; esac
          done < <(env)
          test ! -e "$PUBLISH_ROOT"
          mkdir -p "$PUBLISH_ROOT/bin" "$PUBLISH_ROOT/tools" "$PUBLISH_ROOT/cache"
          UV_PYTHON_INSTALL_DIR="$MANAGED_PYTHON_ROOT" \
            UV_TOOL_BIN_DIR="$PUBLISH_ROOT/bin" \
            UV_TOOL_DIR="$PUBLISH_ROOT/tools" \
            "$PUBLISHER_UV" tool install \
            --no-config \
            --cache-dir "$PUBLISH_ROOT/cache" \
            --managed-python \
            --no-python-downloads \
            --python 3.12.13 \
            twine==6.2.0
          case "$("$PUBLISH_ROOT/bin/twine" --version)" in
            "twine version 6.2.0 "*) ;;
            *) exit 1 ;;
          esac
          printf 'PUBLISHER_TWINE=%s\n' "$PUBLISH_ROOT/bin/twine" >> "$GITHUB_ENV"

      - name: Download data-only verified candidate
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b # v3.1.0-node20
        with:
          name: verified-private-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-transfer

      - name: Enforce bounded credential-job input
        run: |
          set -euo pipefail
          test "$(find verified-transfer -maxdepth 1 -type l | wc -l)" -eq 0
          test "$(find verified-transfer -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find verified-transfer -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find verified-transfer -maxdepth 1 -type f -name 'release-manifest.json' | wc -l)" -eq 1
          test "$(find verified-transfer -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Publish exact files with package-only authority
        env:
          AUTH_PARENT: ${{ runner.temp }}
          GITEA_TOKEN: ${{ secrets.PKG_TOKEN }}
          TWINE_REPOSITORY_URL: https://git.nmulti.cloud/api/packages/emersonfelipesp/pypi
          TWINE_USERNAME: emersonfelipesp
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          AUTH_ROOT="$(mktemp -d "${AUTH_PARENT}/netbox-proxbox-auth.XXXXXX")"
          trap 'rm -f "$AUTH_ROOT/netrc"; rmdir "$AUTH_ROOT"' EXIT
          printf 'machine git.nmulti.cloud\nlogin %s\npassword %s\n' \
            "$TWINE_USERNAME" "$GITEA_TOKEN" > "$AUTH_ROOT/netrc"
          chmod 0600 "$AUTH_ROOT/netrc"
          export TWINE_PASSWORD="$GITEA_TOKEN"
          unset GITEA_TOKEN
          "$PUBLISHER_TWINE" upload --non-interactive \
            verified-transfer/*.whl verified-transfer/*.tar.gz
          unset TWINE_PASSWORD
          curl --fail --silent --show-error --request POST \
            --netrc-file "$AUTH_ROOT/netrc" \
            "https://git.nmulti.cloud/api/v1/packages/emersonfelipesp/pypi/netbox-proxbox/-/link/netbox-proxbox"
          curl --fail --silent --show-error \
            --netrc-file "$AUTH_ROOT/netrc" \
            --upload-file verified-transfer/release-manifest.json \
            "https://git.nmulti.cloud/api/packages/emersonfelipesp/generic/netbox-proxbox-release-manifest/${VERSION}/release-manifest.json"
          curl --fail --silent --show-error --request POST \
            --netrc-file "$AUTH_ROOT/netrc" \
            "https://git.nmulti.cloud/api/v1/packages/emersonfelipesp/generic/netbox-proxbox-release-manifest/-/link/netbox-proxbox"

  verify-registry:
    name: Re-download and verify registry bytes without authority
    needs: [validate-source, publish-gitea]
    runs-on: ci-untrusted-python312
    permissions:
      contents: read
      packages: read
    steps:
      - name: Fetch reviewed verification tool anonymously
        env:
          TOOL_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test ! -e verifier-tool
          git init verifier-tool
          git -C verifier-tool remote add origin \
            https://git.nmulti.cloud/emersonfelipesp/netbox-proxbox.git
          git -C verifier-tool fetch --force --no-tags origin "$TOOL_SHA"
          git -C verifier-tool checkout --detach FETCH_HEAD
          test "$(git -C verifier-tool rev-parse HEAD)" = "$TOOL_SHA"

      - name: Download data-only verified candidate
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b # v3.1.0-node20
        with:
          name: verified-private-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-transfer

      - name: Re-download and compare registry bytes
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          mkdir verified-dist
          python3 verifier-tool/scripts/release_artifacts.py fetch-gitea \
            --owner emersonfelipesp --repository netbox-proxbox \
            --package netbox-proxbox --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --dist verified-dist --manifest verified-manifest.json
          cmp verified-transfer/release-manifest.json verified-manifest.json

  push-to-github:
    name: Promote verified RC tag to GitHub
    needs: [validate-source, verify-registry]
    if: ${{ needs.validate-source.outputs.is_rc == 'true' }}
    runs-on: ci-untrusted-python312
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate-source.outputs.tag }}

      - name: Push immutable RC tag to the authorized GitHub destination
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          TAG: ${{ needs.validate-source.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate-source.outputs.source_sha }}"
          git remote add github https://github.com/emersonfelipesp/netbox-proxbox.git
          SECRET_ROOT="${RUNNER_TEMP}/netbox-proxbox-github-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$SECRET_ROOT"
          mkdir -m 0700 "$SECRET_ROOT"
          trap 'rm -rf -- "$SECRET_ROOT"' EXIT
          cat > "$SECRET_ROOT/askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 0500 "$SECRET_ROOT/askpass"
          GIT_ASKPASS="$SECRET_ROOT/askpass" GIT_TERMINAL_PROMPT=0 \
            git push github "refs/tags/${TAG}:refs/tags/${TAG}"

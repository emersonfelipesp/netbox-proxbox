name: Deploy netbox-proxbox

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      deploy_source:
        description: "Immutable Gitea package by default; canonical main is an explicit override"
        required: true
        default: latest_package
        type: choice
        options:
          - latest_package
          - main_branch
      package_version:
        description: "Exact package version (required only for latest_package)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: netbox-proxbox-${{ github.event_name == 'push' && 'staging' || 'production' }}-deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy plugin to staging
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: prod-deploy
    steps:
      - name: Deploy reviewed develop commit
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(printf '%s' "$GITHUB_SHA" | grep -E '^[a-f0-9]{40}$')"
          /opt/nmulticloud/deploy/bin/deploy-netbox-plugin-staging netbox-proxbox "$GITHUB_SHA"

  production:
    name: Deploy plugin to production through NMS-selected source
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: prod-deploy
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SOURCE: ${{ inputs.deploy_source }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      WORKFLOW_REF: ${{ github.ref }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source-aware production request
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = refs/heads/main
          printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[a-f0-9]{40}$'
          case "$DEPLOY_SOURCE" in
            latest_package)
              printf '%s' "$PACKAGE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*|\.post[1-9][0-9]*)?$'
              ;;
            main_branch)
              test -z "$PACKAGE_VERSION"
              ;;
            *) exit 1 ;;
          esac

      - name: Bind exact package artifacts before deployment
        if: ${{ inputs.deploy_source == 'latest_package' }}
        env:
          GITEA_PACKAGE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/heads/develop:refs/remotes/gitea/release-develop" \
            "+refs/tags/v${PACKAGE_VERSION}:refs/release-policy/candidate"
          SOURCE_SHA="$(git rev-parse refs/release-policy/candidate^{commit})"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/gitea/release-develop
          python3 scripts/release_artifacts.py fetch-gitea \
            --owner emersonfelipesp --repository netbox-proxbox \
            --package netbox-proxbox --version "$PACKAGE_VERSION" \
            --source-sha "$SOURCE_SHA" --dist release-dist \
            --manifest release-manifest.json

      - name: Deploy exact Gitea package
        if: ${{ inputs.deploy_source == 'latest_package' }}
        run: |
          set -euo pipefail
          /opt/nmulticloud/deploy/bin/deploy-netbox-plugin-package netbox-proxbox "$PACKAGE_VERSION"

      - name: Deploy canonical main override
        if: ${{ inputs.deploy_source == 'main_branch' }}
        run: |
          set -euo pipefail
          /opt/nmulticloud/deploy/bin/deploy-netbox-plugin netbox-proxbox "$WORKFLOW_SHA"

      - name: Require healthy production status
        run: /opt/nmulticloud/deploy/bin/status-app netbox

      - name: Publish immutable successful-deployment attestation
        if: ${{ inputs.deploy_source == 'latest_package' }}
        env:
          GITEA_PACKAGE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_artifacts.py create-attestation \
            --manifest release-manifest.json \
            --repository emersonfelipesp/netbox-proxbox \
            --run-id "$GITHUB_RUN_ID" --output completion.json
          python3 scripts/release_artifacts.py publish-attestation \
            --owner emersonfelipesp --repository netbox-proxbox \
            --manifest release-manifest.json --attestation completion.json

      - name: Report failure status
        if: failure()
        run: /opt/nmulticloud/deploy/bin/status-app netbox

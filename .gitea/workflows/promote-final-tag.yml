name: Promote production-validated final tag to GitHub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact final or post-release tag already deployed from Gitea
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: final-tag-promotion-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote-final-tag:
    name: Verify production evidence and promote exact tag
    if: ${{ github.repository == 'emersonfelipesp/netbox-proxbox' && github.ref == 'refs/heads/main' }}
    runs-on: mirror-host
    steps:
      - name: Checkout canonical-main promotion policy
        run: |
          set -euo pipefail
          test ! -e .git
          /usr/bin/git init .
          /usr/bin/git remote add origin \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          /usr/bin/git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          /usr/bin/git checkout --detach FETCH_HEAD
          test "$(/usr/bin/git rev-parse HEAD^{commit})" = "${GITHUB_SHA}"

      - name: Attest live runner and credential consumers
        env:
          GITEA_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          /usr/bin/python3.13 scripts/gitea_mirror_runner_gate.py validate \
            --acceptance .gitea/mirror-runner-acceptance.json \
            --owner emersonfelipesp \
            --repository netbox-proxbox \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name "Verify production evidence and promote exact tag" \
            --source-sha "${GITHUB_SHA}"

      - name: Validate canonical release source and production evidence
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]* | v[0-9]*.[0-9]*.[0-9]*.post[0-9]*) ;;
            *) echo "Final promotion rejects non-final tag: $TAG"; exit 1 ;;
          esac
          /usr/bin/git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/gitea/release-main" \
            "+refs/heads/develop:refs/remotes/gitea/release-develop" \
            "+refs/tags/${TAG}:refs/release-policy/candidate"
          SOURCE_SHA="$(/usr/bin/git rev-parse refs/release-policy/candidate^{commit})"
          test "$(/usr/bin/git rev-parse HEAD^{commit})" = "${GITHUB_SHA}"
          test "$SOURCE_SHA" = "$(/usr/bin/git rev-parse refs/remotes/gitea/release-main^{commit})"
          test "$SOURCE_SHA" = "$(/usr/bin/git rev-parse refs/remotes/gitea/release-develop^{commit})"
          test "$SOURCE_SHA" = "$(/usr/bin/git rev-parse HEAD^{commit})"
          VERSION="${TAG#v}"
          /usr/bin/python3.13 - "$VERSION" <<'PY'
          import ast
          import pathlib
          import re
          import sys
          import tomllib

          version = sys.argv[1]
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:\.post[1-9][0-9]*)?", version) is None:
              raise SystemExit("Final promotion version is not canonical")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          if project["project"]["name"] != "netbox-proxbox":
              raise SystemExit("Unexpected package identity")
          if project["project"]["version"] != version:
              raise SystemExit("Tag and project version differ")
          tree = ast.parse(pathlib.Path("netbox_proxbox/__init__.py").read_text())
          versions = [
              ast.literal_eval(node.value)
              for cls in tree.body
              if isinstance(cls, ast.ClassDef) and cls.name == "ProxboxConfig"
              for node in cls.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "version"
                  for target in node.targets
              )
          ]
          if versions != [version]:
              raise SystemExit("Runtime plugin version differs from tag")
          PY
          mkdir verified-dist
          /usr/bin/python3.13 scripts/release_artifacts.py fetch-gitea \
            --owner emersonfelipesp --repository netbox-proxbox \
            --package netbox-proxbox --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --dist verified-dist --manifest release-manifest.json
          /usr/bin/python3.13 scripts/release_artifacts.py fetch-attestation \
            --owner emersonfelipesp --repository netbox-proxbox \
            --manifest release-manifest.json

      - name: Push exact verified tag to authorized GitHub destination
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          SOURCE_SHA="$(/usr/bin/git rev-parse refs/release-policy/candidate^{commit})"
          SECRET_ROOT="${RUNNER_TEMP}/netbox-proxbox-final-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$SECRET_ROOT"
          mkdir -m 0700 "$SECRET_ROOT"
          trap 'rm -rf -- "$SECRET_ROOT"' EXIT
          export GH_CONFIG_DIR="${SECRET_ROOT}/gh"
          mkdir -m 0700 "${GH_CONFIG_DIR}"
          cat > "$SECRET_ROOT/askpass" <<'EOF'
          #!/usr/bin/dash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 0500 "$SECRET_ROOT/askpass"
          GH_REPO="emersonfelipesp/netbox-proxbox"
          /usr/bin/gh auth status --hostname github.com
          test "$(/usr/bin/gh repo view "${GH_REPO}" --json nameWithOwner --jq .nameWithOwner)" = \
            "${GH_REPO}"
          test "$(/usr/bin/gh api "repos/${GH_REPO}" --jq '.permissions.push')" = "true" || {
            echo "ERROR: GitHub token lacks push permission for ${GH_REPO}"
            exit 1
          }
          RULESET_IDS="$(/usr/bin/gh api \
            --paginate \
            "repos/${GH_REPO}/rulesets?targets=tag&includes_parents=true&per_page=100" \
            --jq '.[].id')"
          test -n "${RULESET_IDS}" || {
            echo "ERROR: no GitHub tag ruleset protects final tags"
            exit 1
          }
          mkdir -m 0700 "${SECRET_ROOT}/rulesets"
          while IFS= read -r RULESET_ID; do
            case "${RULESET_ID}" in
              ''|*[!0-9]*) echo "ERROR: invalid GitHub ruleset id"; exit 1 ;;
            esac
            /usr/bin/gh api "repos/${GH_REPO}/rulesets/${RULESET_ID}?includes_parents=true" \
              > "${SECRET_ROOT}/rulesets/${RULESET_ID}.json"
          done <<< "${RULESET_IDS}"
          env -u GH_TOKEN /usr/bin/python3.13 scripts/release_artifacts.py \
            validate-github-tag-rulesets \
            --rulesets "${SECRET_ROOT}/rulesets" \
            --repository "${GH_REPO}" \
            --tag "${TAG}"
          /usr/bin/git remote add github https://github.com/emersonfelipesp/netbox-proxbox.git
          test "$(/usr/bin/git remote get-url github)" = \
            "https://github.com/emersonfelipesp/netbox-proxbox.git"
          LOCAL_TAG_OBJECT="$(/usr/bin/git rev-parse refs/release-policy/candidate)"
          EXISTING_TAG_LINE="$(GIT_ASKPASS="$SECRET_ROOT/askpass" \
            GIT_TERMINAL_PROMPT=0 /usr/bin/git ls-remote github \
            "refs/tags/${TAG}")"
          EXISTING_PEELED_LINE="$(GIT_ASKPASS="$SECRET_ROOT/askpass" \
            GIT_TERMINAL_PROMPT=0 /usr/bin/git ls-remote github \
            "refs/tags/${TAG}^{}")"
          if [ -n "$EXISTING_TAG_LINE" ]; then
            EXISTING_TAG_OBJECT="${EXISTING_TAG_LINE%%[[:space:]]*}"
            if [ -n "$EXISTING_PEELED_LINE" ]; then
              EXISTING_SOURCE_SHA="${EXISTING_PEELED_LINE%%[[:space:]]*}"
            else
              EXISTING_SOURCE_SHA="$EXISTING_TAG_OBJECT"
            fi
            test "$EXISTING_TAG_OBJECT" = "$LOCAL_TAG_OBJECT" || {
              echo "ERROR: existing GitHub tag ${TAG} points to a different object"
              exit 1
            }
            test "$EXISTING_SOURCE_SHA" = "$SOURCE_SHA" || {
              echo "ERROR: existing GitHub tag ${TAG} peels to a different source"
              exit 1
            }
            echo "GitHub tag ${TAG} already matches the verified object; resuming readback"
          else
            GIT_ASKPASS="$SECRET_ROOT/askpass" GIT_TERMINAL_PROMPT=0 \
              /usr/bin/git push github \
              "refs/release-policy/candidate:refs/tags/${TAG}"
          fi
          REMOTE_TAG_OBJECT="$(GIT_ASKPASS="$SECRET_ROOT/askpass" \
            GIT_TERMINAL_PROMPT=0 /usr/bin/git ls-remote --exit-code github \
            "refs/tags/${TAG}" | awk '{print $1}')"
          REMOTE_PEELED_LINE="$(GIT_ASKPASS="$SECRET_ROOT/askpass" \
            GIT_TERMINAL_PROMPT=0 /usr/bin/git ls-remote github \
            "refs/tags/${TAG}^{}")"
          if [ -n "$REMOTE_PEELED_LINE" ]; then
            REMOTE_SOURCE_SHA="${REMOTE_PEELED_LINE%%[[:space:]]*}"
          else
            REMOTE_SOURCE_SHA="$REMOTE_TAG_OBJECT"
          fi
          test "$REMOTE_TAG_OBJECT" = "$LOCAL_TAG_OBJECT"
          test "$REMOTE_SOURCE_SHA" = "$SOURCE_SHA"
